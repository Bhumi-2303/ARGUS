services:
  argus-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-platform:latest
    container_name: argus-platform
    ports:
      - "${ARGUS_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ARGUS_MODE=${ARGUS_MODE:-demo}
      - ARGUS_HOST=0.0.0.0
      - ARGUS_PORT=8000
      - ARGUS_ALLOWED_ORIGINS=${ARGUS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173,http://127.0.0.1:8000,http://127.0.0.1:5173}
      - PYTHONPATH=/app/src:/app
      - MPLCONFIGDIR=/tmp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

roles:
  SECURITY_ADMIN:
    permissions:
      - "system:admin"
      - "*"
  
  INCIDENT_RESPONDER:
    permissions:
      - "events:read"
      - "events:write"
      - "incidents:read"
      - "incidents:update"
      - "incidents:close"
      - "policy:read"
      - "response:request"
      - "response:approve"
      - "audit:read"
  
  ANALYST:
    permissions:
      - "events:read"
      - "incidents:read"
      - "incidents:update"
      - "policy:read"
      - "response:request"
      - "audit:read"
  
  VIEWER:
    permissions:
      - "events:read"
      - "incidents:read"
      - "policy:read"
      - "audit:read"

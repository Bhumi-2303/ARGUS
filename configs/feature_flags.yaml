flags:
  agent_runtime:
    description: "Enable optional agent runtime layer (read-only MCP server & ADK analyst narrator)"
    enabled: false

  adk_planning:
    description: "Enable Google ADK planning for agents"
    enabled: false

  adk_narrator:
    description: "Enable optional LLM incident narrator (summarizes already-computed incident outputs)"
    enabled: false

  mcp_server:
    description: "Enable read-only MCP server exposing inspection tools"
    enabled: false
  
  vector_memory:
    description: "Enable ChromaDB vector memory for context retrieval"
    enabled: true
  
  audit_logging:
    description: "Enable comprehensive audit logging to database"
    enabled: true
  
  rate_limiting:
    description: "Enable API rate limiting"
    enabled: true

model:
  name: "neural_network"
  type: "classification"
  library: "sklearn"
  class: "sklearn.neural_network.MLPClassifier"

parameters:
  hidden_layer_sizes: [256, 128, 64]
  activation: "relu"
  solver: "adam"
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 50
  early_stopping: true
  n_iter_no_change: 10
  validation_fraction: 0.1
  random_state: 42

tuning_space:
  learning_rate:
    type: float
    low: 0.0001
    high: 0.01
    log: true
  batch_size:
    type: categorical
    choices: [64, 128, 256, 512]
  layers_0_units:
    type: categorical
    choices: [128, 256, 512]
  layers_1_units:
    type: categorical
    choices: [64, 128, 256]

model:
  name: "random_forest"
  type: "classification"
  library: "sklearn"
  class: "sklearn.ensemble.RandomForestClassifier"

parameters:
  n_estimators: 200
  max_depth: 20
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: "sqrt"
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

tuning_space:
  n_estimators:
    type: int
    low: 50
    high: 500
  max_depth:
    type: int
    low: 5
    high: 50
  min_samples_split:
    type: int
    low: 2
    high: 20
  min_samples_leaf:
    type: int
    low: 1
    high: 10

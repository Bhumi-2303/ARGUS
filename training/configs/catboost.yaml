model:
  name: "catboost"
  type: "classification"
  library: "catboost"
  class: "catboost.CatBoostClassifier"

parameters:
  iterations: 500
  depth: 8
  learning_rate: 0.05
  l2_leaf_reg: 3.0
  border_count: 128
  auto_class_weights: "Balanced"
  random_seed: 42
  verbose: 0
  thread_count: -1
  task_type: "CPU"

tuning_space:
  iterations:
    type: int
    low: 100
    high: 1000
  depth:
    type: int
    low: 4
    high: 12
  learning_rate:
    type: float
    low: 0.001
    high: 0.3
    log: true
  l2_leaf_reg:
    type: float
    low: 1.0
    high: 10.0

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for ARGUS dependencies, test fixtures, and data artifacts"
paths = [
    '''node_modules''',
    '''web/node_modules''',
    '''web/dist''',
    '''\.git''',
    '''\.venv''',
    '''\.pytest_cache''',
    '''data/samples''',
    '''artifacts/manifest\.json''',
    '''docs/data_metrics_baseline\.json''',
    '''tests/security/test_auth_oidc_jwks\.py'''
]
stopwords = [
    "eyJhbGciOiJSUzI1NiIsImtpZCI6InVua25vd24ifQ"
]

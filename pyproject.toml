[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — Autonomous Risk-aware Grid Understanding & Security. AI-powered cybersecurity platform for Smart Grid Infrastructure."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ARGUS Team" },
]
keywords = ["cybersecurity", "smart-grid", "multi-agent", "ai", "security", "domain-adaptation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dann = [
    "torch>=2.2.0",
    "umap-learn>=0.5.5",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/argus"]
asyncio_mode = "auto"

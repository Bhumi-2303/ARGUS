name: ARGUS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Dependencies, Lint & Type Check
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

      - name: Run MyPy type check
        run: mypy src/argus/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking until type stubs are complete

  # --------------------------------------------------------------------------
  # Stage 2: Unit & Integration Tests (Backend)
  # --------------------------------------------------------------------------
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Unit Tests
        run: pytest tests/unit/ tests/schemas/ tests/policy/ tests/services/ --tb=short -v
        env:
          PYTHONPATH: src

      - name: Run Integration & E2E Tests
        run: pytest tests/integration/ tests/e2e/ --tb=short -v
        env:
          PYTHONPATH: src

  # --------------------------------------------------------------------------
  # Stage 3: Frontend Build
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Stage 4: Docker Configuration & Smoke Test
  # --------------------------------------------------------------------------
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs: [test-backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build Smoke Test
        # Building the api image as a smoke test to ensure Dockerfile is valid
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: argus/detector-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

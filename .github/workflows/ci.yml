name: ARGUS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # ----------------------------------------------------------------------------
  # 1. Python Linting & Type Checking
  # ----------------------------------------------------------------------------
  lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra test

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/ configs/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/ tests/ configs/

      - name: Run MyPy type check
        run: uv run mypy src/argus/ --ignore-missing-imports
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # 2. Backend Unit & E2E Tests with Coverage
  # ----------------------------------------------------------------------------
  test-backend:
    name: Backend Tests with Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - lint
      - web-lint-and-build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Compiled Frontend
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: web-dist
          path: web/dist

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra test

      - name: Run Full Test Suite with Coverage
        run: uv run pytest --tb=short -v --cov=src/argus --cov-report=xml --cov-report=term
        env:
          PYTHONPATH: src:tests:.

      - name: Run UI Numerical & Integrity Verification
        run: uv run python scripts/verify_ui_numbers.py
        env:
          PYTHONPATH: src:tests:.

  # ----------------------------------------------------------------------------
  # 3. Frontend Lint & Build
  # ----------------------------------------------------------------------------
  web-lint-and-build:
    name: Web Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Run Oxlint Web Linter
        working-directory: web
        run: npm run lint

      - name: Build Frontend SPA
        working-directory: web
        run: npm run build

      - name: Upload Compiled Frontend Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 4. Playwright E2E Smoke Tests
  # ----------------------------------------------------------------------------
  playwright-smoke:
    name: Playwright UI Smoke Tests
    runs-on: ubuntu-latest
    needs: web-lint-and-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Compiled Frontend
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: web-dist
          path: web/dist

      - name: Install Node dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra test

      - name: Start backend server
        run: |
          uv run python scripts/start_demo.py > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become healthy within 60s"
          cat backend.log
          exit 1

      - name: Run Playwright Smoke Tests
        working-directory: web
        env:
          ARGUS_E2E_BASE_URL: http://127.0.0.1:8000
          CI: 'true'
        run: npm run test:e2e

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) 2>/dev/null || true
          fi

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload Backend Log on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backend-log
          path: backend.log
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 5. Security Scanning (Bandit, pip-audit, Gitleaks)
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security Audit & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra test

      - name: Python Dependency Audit (pip-audit)
        run: uv run pip-audit .

      - name: Static Application Security Testing (Bandit)
        run: uv run bandit -r src/ configs/ -ll -ii

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run Security Test Suite
        run: uv run pytest tests/security/ -v
        env:
          PYTHONPATH: src:tests:.

  # ----------------------------------------------------------------------------
  # 6. Multi-Arch Docker Build & Image Size Inspection
  # ----------------------------------------------------------------------------
  docker-build-multiarch:
    name: Multi-Arch Container Build (linux/amd64 & linux/arm64)
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - web-lint-and-build
      - security-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Multi-Arch Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: argus-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Single-Arch Local Build for Size Reporting
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: argus-platform:report
          cache-from: type=gha

      - name: Report Container Image Size & Layers
        run: |
          echo "=========================================================="
          echo "ARGUS Container Image Size Report:"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep argus-platform
          echo "=========================================================="
          docker history argus-platform:report --human --format "table {{.CreatedBy}}\t{{.Size}}" | head -n 15

  # ----------------------------------------------------------------------------
  # 7. Gated Deploy: Cloudflare Pages (Frontend SPA)
  # ----------------------------------------------------------------------------
  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs:
      - playwright-smoke
      - docker-build-multiarch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-pages
      url: https://argus-platform.pages.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Compiled Frontend
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

  # ----------------------------------------------------------------------------
  # 8. Gated Deploy: Oracle Cloud ARM VM (Backend Container)
  # ----------------------------------------------------------------------------
  deploy-oracle-arm-vm:
    name: Deploy to Oracle Cloud ARM VM
    runs-on: ubuntu-latest
    needs:
      - docker-build-multiarch
      - deploy-cloudflare-pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-oracle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Oracle Cloud ARM VM via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /opt/argus
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            ./scripts/smoke_test.sh http://localhost:8000

name: ARGUS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
          uv pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check src/ tests/ configs/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/ configs/

      - name: Run MyPy type check
        run: mypy src/argus/ --ignore-missing-imports
        continue-on-error: true

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Run Full Test Suite
        run: pytest tests/ --tb=short -v
        env:
          PYTHONPATH: src:tests:.

      - name: Run UI Numerical & Integrity Checks
        run: python scripts/verify_ui_numbers.py
        env:
          PYTHONPATH: src:tests:.

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build frontend
        working-directory: web
        run: npm run build

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build Smoke Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: argus/detector-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'argus/detector-api:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  security-scan:
    name: Security Audit & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
          # Install bandit and pip-audit for security scanning globally or within venv
          uv pip install bandit pip-audit

      - name: Python Dependency Audit (pip-audit)
        run: pip-audit .

      - name: Static Application Security Testing (Bandit)
        run: bandit -r src/ configs/ -ll -ii

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run Security Test Suite
        run: pytest tests/security/ -v
        env:
          PYTHONPATH: src:tests:.

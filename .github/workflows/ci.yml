name: ARGUS CI/CD Pipeline
true:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install ruff mypy

        pip install -e ".[dev]"

        '
    - name: Run Ruff linter
      run: ruff check src/ tests/
    - name: Run Ruff formatter check
      run: ruff format --check src/ tests/
    - name: Run MyPy type check
      run: mypy src/argus/ --ignore-missing-imports
      continue-on-error: true
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -e ".[test]"

        '
    - name: Run Unit Tests
      run: pytest tests/unit/ tests/schemas/ tests/policy/ tests/services/ --tb=short
        -v
      env:
        PYTHONPATH: src:tests:.
    - name: Run Integration & E2E Tests
      run: pytest tests/integration/ tests/e2e/ --tb=short -v
      env:
        PYTHONPATH: src:tests:.
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install
    - name: Build frontend
      working-directory: frontend
      run: npm run build
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs:
    - test-backend
    - frontend
    steps:
    - uses: actions/checkout@v4
    - name: Validate Docker Compose Configuration
      run: docker compose config -q
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Docker Build Smoke Test
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: argus/detector-api:ci-test
        cache-from: type=gha
        cache-to: type=gha,mode=max
  security-scan:
    name: Security Audit & Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Python Dependency Audit
      run: python -m pip install pip-audit && pip-audit -r pyproject.toml --desc ||
        echo "Audit findings exist"
    - name: Secret Scan
      run: grep -riE "(password|secret|api_key|token)[ :=]+['\"][a-zA-Z0-9_-]{10,}['\"]"
        src/ config/ || echo "No hardcoded secrets found"
    - name: Run Security Tests
      run: python -m pip install -e ".[test]" && pytest tests/security/ -v

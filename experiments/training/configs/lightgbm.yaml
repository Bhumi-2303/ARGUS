model:
  name: "lightgbm"
  type: "classification"
  library: "lightgbm"
  class: "lightgbm.LGBMClassifier"

parameters:
  n_estimators: 300
  max_depth: -1
  learning_rate: 0.05
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_alpha: 0.01
  reg_lambda: 1.0
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1
  verbose: -1

tuning_space:
  n_estimators:
    type: int
    low: 100
    high: 1000
  num_leaves:
    type: int
    low: 15
    high: 127
  learning_rate:
    type: float
    low: 0.001
    high: 0.3
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  min_child_samples:
    type: int
    low: 5
    high: 50

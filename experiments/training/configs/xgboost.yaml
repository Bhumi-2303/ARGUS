model:
  name: "xgboost"
  type: "classification"
  library: "xgboost"
  class: "xgboost.XGBClassifier"

parameters:
  n_estimators: 300
  max_depth: 8
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.01
  reg_lambda: 1.0
  objective: "multi:softprob"
  eval_metric: "mlogloss"
  tree_method: "hist"
  random_state: 42
  n_jobs: -1
  verbosity: 0

tuning_space:
  n_estimators:
    type: int
    low: 100
    high: 1000
  max_depth:
    type: int
    low: 3
    high: 15
  learning_rate:
    type: float
    low: 0.001
    high: 0.3
    log: true
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
